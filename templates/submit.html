{% extends "base.html" %}

{% block title %}Submit Salary - SalaryMPC{% endblock %}

{% block content %}

<div class="form-card">
    <h1>Submit Your Salary</h1>
    <p>Enter your salary details securely for private benchmarking.</p>

    <form method="POST" action="{{ url_for('submit_salary') }}">

        <div class="form-group">
            <label for="salary">Annual Salary (₹)</label>
            <input
                type="number"
                id="salary"
                name="salary"
                placeholder="Example: 600000"
                min="1"
                required
            >
        </div>

        <div class="form-group">
            <label for="job_role">Job Role</label>
            <input
                type="text"
                id="job_role"
                name="job_role"
                placeholder="Example: Software Developer"
                required
            >
        </div>

        <div class="form-group">
            <label for="experience">Years of Experience</label>
            <input
                type="number"
                id="experience"
                name="experience"
                placeholder="Example: 2"
                min="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="industry">Industry</label>
            <input
                type="text"
                id="industry"
                name="industry"
                placeholder="Example: Information Technology"
                required
            >
        </div>

        <button type="submit" class="btn">
            Submit Salary Securely
        </button>

    </form>
</div>

{% endblock %}
