{% extends "base.html" %}

{% block title %}Login - SalaryMPC{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .login-box {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    .login-box .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #1e3a8a;
        margin-bottom: 6px;
    }

    .login-box .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 15px;
        margin-bottom: 30px;
    }

    .login-box label {
        display: block;
        color: #374151;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .login-box input {
        display: block;
        width: 100%;
        height: 46px;
        padding: 10px 13px;
        margin: 0 0 20px 0;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        color: #111827;
        font-size: 15px;
        outline: none;
    }

    .login-box input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-box button {
        display: block;
        width: 100%;
        height: 46px;
        margin-top: 5px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-box button:hover {
        background: #1d4ed8;
    }

    .register-text {
        text-align: center;
        margin-top: 24px;
        color: #64748b;
        font-size: 14px;
    }

    .register-text a {
        color: #2563eb;
        font-weight: bold;
        text-decoration: none;
    }

    .register-text a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-page">

    <div class="login-box">

        <div class="logo">
            🔒 SalaryMPC
        </div>

        <div class="subtitle">
            Secure Salary Benchmarking
        </div>

        <form method="POST" action="{{ url_for('login') }}">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register here
            </a>
        </div>

    </div>

</div>

{% endblock %}
